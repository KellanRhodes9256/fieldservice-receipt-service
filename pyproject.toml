[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldservice-receipt-service"
version = "0.1.0"
description = "Typed field-service receipt email service with dispatch and follow-up context"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
